[providers]
  php = true
  node = true

[phases.setup]
  nixPkgs = ["php84", "php84Packages.composer", "nodejs_20", "git", "gh", "unzip", "zip", "nano", "tmux", "sqlite", "mariadb"]

[phases.install]
  cmds = [
    "mkdir -p /app/.bin",
    "curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- -d /app/.bin",
    "ln -sf /app/.bin/agy /usr/local/bin/agy"
  ]

[start]
  cmd = "bash ./entrypoint.sh daemon"
