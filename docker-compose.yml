services:
  # ============================================================================
  # Antigravity CLI Daemon (Remote Control + PHP/Laravel + GitHub CLI)
  # ============================================================================
  antigravity-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-daemon
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      # Puerto Hub interno de agy (restringido a localhost del host por seguridad)
      - "127.0.0.1:${HUB_PORT:-4400}:4400"
      # Puerto para aplicaciones web Laravel (php artisan serve)
      - "${APP_PORT:-8000}:8000"
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-vps-antigravity}
      - HUB_PORT=${HUB_PORT:-4400}
      - TZ=${TZ:-UTC}
      # GitHub CLI Token (opcional para autenticación no-interactiva)
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Variables de Base de Datos para Laravel
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-laravel_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      # Directorio de trabajo y código fuente en el VPS
      - ./workspace:/workspace
      # Persistencia de tokens OAuth y credenciales de Antigravity
      - gemini_data:/home/antigravity/.gemini
      # Persistencia de memoria, estado del agente y logs del daemon
      - antigravity_state:/home/antigravity/.antigravity
      # Persistencia de configuración y sesión de GitHub CLI
      - gh_config:/home/antigravity/.config/gh
      # Caché de paquetes Composer para agilizar descargas
      - composer_cache:/home/antigravity/.composer

  # ============================================================================
  # Base de datos opcional (MariaDB / MySQL) para proyectos Laravel
  # Actívala con: docker compose --profile with-db up -d
  # ============================================================================
  db:
    image: mariadb:11
    container_name: antigravity-db
    restart: unless-stopped
    profiles:
      - with-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  gemini_data:
    name: antigravity_gemini_data
  antigravity_state:
    name: antigravity_state_data
  gh_config:
    name: antigravity_gh_config
  composer_cache:
    name: antigravity_composer_cache
  db_data:
    name: antigravity_db_data
